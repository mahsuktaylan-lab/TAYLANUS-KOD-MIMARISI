[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taylang"
version = "0.8.0.dev2"
description = "TAY scientific language with an optional TAYLANUS v3 CFD engine"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "TAYLANUS Project"}
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7"
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering"
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
taylanus = ["scipy>=1.10", "numba>=0.58"]
dev = ["pytest>=8", "build>=1.2"]

[project.scripts]
tay = "taylang.cli:main"

[tool.setuptools]
py-modules = ["taylanus_core"]

[tool.setuptools.packages.find]
where = ["."]
include = ["taylang*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
